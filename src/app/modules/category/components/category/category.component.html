<section class="category-page">
  <mat-card class="category-card">
    <mat-card-header>
      <mat-card-title>Listado de categorías</mat-card-title>
      <mat-card-subtitle>Administra las categorías del inventario</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <div class="category-actions">
        <mat-form-field appearance="outline" class="search-field">
          <mat-label>Buscar categoría</mat-label>
          <input matInput #input aria-label="Buscar categoría">
          <mat-icon matSuffix>search</mat-icon>
        </mat-form-field>

        <button mat-raised-button color="primary" type="button">
          <mat-icon>add</mat-icon>
          Agregar categoría
        </button>
      </div>

      <div class="table-container">
        <table mat-table [dataSource]="dataSource" class="mat-cell">
          <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef>ID</th>
            <td mat-cell *matCellDef="let category">{{ category.id }}</td>
          </ng-container>

          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef>Nombre</th>
            <td mat-cell *matCellDef="let category">{{ category.name }}</td>
          </ng-container>

          <ng-container matColumnDef="description">
            <th mat-header-cell *matHeaderCellDef>Descripción</th>
            <td mat-cell *matCellDef="let category">{{ category.description }}</td>
          </ng-container>

          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>Acciones</th>
            <td mat-cell *matCellDef="let element; let i=index">
              <button mat-icon-button color="accent" aria-label="Editar categoría">
                <mat-icon>edit</mat-icon>
              </button>
              <button mat-icon-button color="accent" aria-label="Delete">
                <mat-icon>Delete</mat-icon>
              </button>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
        </table>
        <mat-paginator [pageSizeOptions]="[5,10,20]"showFirstLastButtons></mat-paginator>
      </div>
    </mat-card-content>
  </mat-card>
</section>
